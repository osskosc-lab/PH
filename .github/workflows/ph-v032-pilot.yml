name: PH v0.3.2 Pilot G0-G7

on:
  push:
    branches:
      - experiment/ph-v0.3.2-dynamic-identifiability
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen runtime
        run: python -m pip install -r experiments/v0.3.2/requirements.txt
      - name: Run fresh Pilot
        id: pilot
        shell: bash
        run: |
          set +e
          python experiments/v0.3.2/ph_v032_pilot.py --outdir experiments/v0.3.2/artifacts/pilot
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload Pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ph-v0.3.2-pilot-g0-g7
          path: experiments/v0.3.2/artifacts/pilot/
          if-no-files-found: error
      - name: Enforce preregistered STOP rule
        if: always()
        shell: bash
        run: |
          code='${{ steps.pilot.outputs.exit_code }}'
          if [ -z "$code" ]; then
            echo "Pilot did not return an exit code"
            exit 3
          fi
          exit "$code"
