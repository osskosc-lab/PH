name: PH v0.3.2-r1 Pilot G0-G7

on:
  push:
    branches:
      - experiment/ph-v0.3.2-r1-representation-stability
    paths:
      - 'experiments/v0.3.2-r1/**'
      - '.github/workflows/ph-v032-r1-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frozen runtime
        run: python -m pip install -r experiments/v0.3.2-r1/requirements.txt

      - name: Compile experiment entrypoints
        run: |
          python -m py_compile experiments/v0.3.2/ph_v032_pilot.py
          python -m py_compile experiments/v0.3.2-r1/ph_v032_r1_pilot.py

      - name: Run fresh r1 Pilot
        id: pilot
        shell: bash
        run: |
          set +e
          python experiments/v0.3.2-r1/ph_v032_r1_pilot.py --outdir experiments/v0.3.2-r1/artifacts/pilot
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload r1 Pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ph-v0.3.2-r1-pilot-g0-g7
          path: experiments/v0.3.2-r1/artifacts/pilot/
          if-no-files-found: error

      - name: Enforce preregistered STOP rule
        if: always()
        shell: bash
        run: |
          code='${{ steps.pilot.outputs.exit_code }}'
          if [ -z "$code" ]; then
            echo "Pilot did not return an exit code"
            exit 3
          fi
          exit "$code"
