name: PH v0.3.1-r2 checks

on:
  pull_request:
    paths:
      - 'PH_v031_r2/**'
      - '.github/workflows/ph-v031-r2.yml'
  push:
    paths:
      - 'PH_v031_r2/**'
      - '.github/workflows/ph-v031-r2.yml'
  workflow_dispatch:

jobs:
  pilot-stop-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r PH_v031_r2/requirements.txt
      - run: pytest -q PH_v031_r2/tests/test_r2.py
      - run: python PH_v031_r2/pilot_engine.py
      - run: python -c "import json,pathlib; r=pathlib.Path('PH_v031_r2/results'); k=json.loads((r/'kernel_pilot_selection.json').read_text()); d=json.loads((r/'decision.json').read_text()); assert k['passed'] is False; assert d['decision']=='INCONCLUSIVE'; assert d['confirmatory_started'] is False; assert not pathlib.Path('PH_v031_r2/preregistration/freeze.json').exists()"
