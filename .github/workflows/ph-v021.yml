name: PH v0.2.1

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      run_full:
        description: Run full Development/Validation/Confirmatory experiment
        required: false
        default: 'false'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: pytest -q tests/test_v021.py

  full-experiment:
    if: github.event_name == 'workflow_dispatch' && inputs.run_full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python src/ph_v021_causal_specificity.py --outdir ph_v021_reproduction
      - uses: actions/upload-artifact@v4
        with:
          name: ph-v021-reproduction
          path: ph_v021_reproduction/
